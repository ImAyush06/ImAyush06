<svg width="850" height="170" viewBox="0 0 850 170" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Panel -->
  <rect width="850" height="170" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle Accent Grid Dots -->
  <g opacity="0.15">
    <circle cx="780" cy="40" r="2" fill="#38BDF8"/>
    <circle cx="800" cy="40" r="2" fill="#38BDF8"/>
    <circle cx="820" cy="40" r="2" fill="#38BDF8"/>
    <circle cx="780" cy="60" r="2" fill="#38BDF8"/>
    <circle cx="800" cy="60" r="2" fill="#38BDF8"/>
    <circle cx="820" cy="60" r="2" fill="#38BDF8"/>
    <circle cx="780" cy="80" r="2" fill="#38BDF8"/>
    <circle cx="800" cy="80" r="2" fill="#38BDF8"/>
    <circle cx="820" cy="80" r="2" fill="#38BDF8"/>
  </g>

  <!-- Left Accent Bar -->
  <rect x="35" y="36" width="4" height="98" rx="2" fill="#38BDF8"/>

  <!-- Header Title -->
  <text x="55" y="68" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5">AYUSH KUMAR</text>

  <!-- Subtitle -->
  <text x="55" y="98" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5">SOFTWARE ENGINEER | FULL-STACK &amp; SYSTEMS DEVELOPER</text>

  <!-- Sub-description -->
  <text x="55" y="124" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400">Lovely Professional University • B.Tech Computer Science &amp; Engineering</text>

  <!-- Bottom Accent Line -->
  <rect x="55" y="137" width="460" height="2" rx="1" fill="url(#lineGrad)"/>
</svg>
